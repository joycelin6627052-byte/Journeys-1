    const pageImages = {};

    const directScanToPageMap = {
      "8.png": 8, "9.png": 10, "10.png": 11, "11.png": 12, "12.png": 13,
      "13.png": 14, "14.png": 15, "15.png": 16, "16.png": 17, "17.png": 18,
      "18.png": 19, "19.png": 20, "20.png": 21, "21.png": 22, "22.png": 23,
      "23.png": 24, "24.png": 25, "25.png": 26, "26.png": 27, "27.png": 28,
      "28.png": 29, "29.png": 30, "30.png": 31, "31.png": 32, "32.png": 33,
      "33.png": 34, "34.png": 35, "35.png": 36, "36.png": 37
    };

    let currentIndex = 0;
    let currentRate = 0.7; // 預設 0.7x 幼童精聽語速
    let currentSpeakingId = null;
    let isReadingPage = false;
    let readTimeout = null;
    let activeHotspot = null;

    const pageImg = document.getElementById('pageImg');
    const fallbackCard = document.getElementById('fallbackCard');
    const hotspotsContainer = document.getElementById('hotspotsContainer');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const pageBadge = document.getElementById('pageBadge');
    const captionText = document.getElementById('captionText');
    const captionTrans = document.getElementById('captionTrans');
    const btnReplay = document.getElementById('btnReplay');
    const btnReadAll = document.getElementById('btnReadAll');
    const btnOpenManager = document.getElementById('btnOpenManager');
    const btnCloseManager = document.getElementById('btnCloseManager');
    const managerModal = document.getElementById('managerModal');
    const managerList = document.getElementById('managerList');
    const btnExport = document.getElementById('btnExport');

    // 自然語音搜尋
    function getBestVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      const en = voices.filter(v => v.lang.startsWith('en'));
      return en.find(v => {
        const n = v.name.toLowerCase();
        return n.includes('natural') || n.includes('neural') || n.includes('jenny') || n.includes('ana');
      }) || en[0] || voices[0] || null;
    }

    // 發音播放
    function speakText(text, onEnd) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = currentRate;
      utterance.pitch = 1.15;
      utterance.lang = 'en-US';
      const best = getBestVoice();
      if (best) utterance.voice = best;

      utterance.onend = () => {
        currentSpeakingId = null;
        updateSpeakingState();
        if (onEnd) onEnd();
      };
      utterance.onerror = () => {
        currentSpeakingId = null;
        updateSpeakingState();
        if (onEnd) onEnd();
      };
      window.speechSynthesis.speak(utterance);
    }

    function stopSpeaking() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (readTimeout) {
        clearTimeout(readTimeout);
        readTimeout = null;
      }
      currentSpeakingId = null;
      isReadingPage = false;
      btnReadAll.textContent = '▶ 朗讀整頁';
      btnReadAll.classList.remove('reading');
      updateSpeakingState();
    }

    function updateSpeakingState() {
      document.querySelectorAll('.hotspot').forEach(el => {
        const id = el.dataset.id;
        if (id === currentSpeakingId) {
          el.classList.add('speaking');
        } else {
          el.classList.remove('speaking');
        }
      });
    }

    function playHotspot(hs) {
      stopSpeaking();
      activeHotspot = hs;
      currentSpeakingId = hs.id;
      captionText.textContent = hs.text;
      captionTrans.textContent = hs.translation || '';
      btnReplay.style.display = 'block';
      updateSpeakingState();
      speakText(hs.text);
    }

    function playWholePage() {
      stopSpeaking();
      const page = pages[currentIndex];
      if (!page || !page.hotspots || page.hotspots.length === 0) return;

      isReadingPage = true;
      btnReadAll.textContent = '⏹️ 停止朗讀';
      btnReadAll.classList.add('reading');

      let idx = 0;
      function next() {
        if (!isReadingPage || idx >= page.hotspots.length) {
          stopSpeaking();
          return;
        }
        const hs = page.hotspots[idx];
        activeHotspot = hs;
        currentSpeakingId = hs.id;
        captionText.textContent = hs.text;
        captionTrans.textContent = hs.translation || '';
        btnReplay.style.display = 'block';
        updateSpeakingState();

        speakText(hs.text, () => {
          idx++;
          readTimeout = setTimeout(next, 500);
        });
      }
      next();
    }

    // 渲染指定頁
    function renderPage(idx) {
      currentIndex = idx;
      stopSpeaking();
      const page = pages[currentIndex];
      if (!page) return;

      pageBadge.textContent = `P.${page.pageNumber} (${currentIndex + 1}/29)`;
      btnPrev.disabled = currentIndex === 0;
      btnNext.disabled = currentIndex === pages.length - 1;

      const customImg = pageImages[page.pageNumber];
      const imgSrc = customImg || ('./' + page.fileName);

      pageImg.onload = () => {
        pageImg.style.display = 'block';
        fallbackCard.style.display = 'none';
      };
      pageImg.onerror = () => {
        pageImg.style.display = 'none';
        fallbackCard.style.display = 'flex';
        document.getElementById('fbSection').textContent = page.section;
        document.getElementById('fbPage').textContent = `P.${page.pageNumber}`;
        document.getElementById('fbQuote').textContent = page.hotspots[0]?.text || page.title;
        document.getElementById('fbSummary').textContent = page.summary;
        document.getElementById('fbNum').textContent = `Page ${page.pageNumber}`;
      };
      pageImg.src = imgSrc;

      // 渲染熱區
      hotspotsContainer.innerHTML = '';
      page.hotspots.forEach(hs => {
        const div = document.createElement('div');
        div.className = 'hotspot';
        div.dataset.id = hs.id;
        div.style.top = hs.box.top + '%';
        div.style.left = hs.box.left + '%';
        div.style.width = hs.box.width + '%';
        div.style.height = hs.box.height + '%';
        div.title = hs.text;

        const icon = document.createElement('span');
        icon.className = 'hotspot-speaker-icon';
        icon.textContent = '🔊';
        div.appendChild(icon);

        div.addEventListener('click', (e) => {
          e.stopPropagation();
          playHotspot(hs);
        });

        hotspotsContainer.appendChild(div);
      });

      if (page.hotspots.length > 0) {
        activeHotspot = page.hotspots[0];
        captionText.textContent = activeHotspot.text;
        captionTrans.textContent = activeHotspot.translation || '';
        btnReplay.style.display = 'block';
      } else {
        activeHotspot = null;
        captionText.textContent = '本頁為導引插頁';
        captionTrans.textContent = '';
        btnReplay.style.display = 'none';
      }
    }

    // 建立 29 頁圖片管理面板
    function buildManager() {
      managerList.innerHTML = '';

      const batchDiv = document.createElement('div');
      batchDiv.style.cssText = 'background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 10px 14px; font-size: 0.8rem; color: #1d4ed8; display: flex; align-items: center; justify-content: space-between;';
      batchDiv.innerHTML = '<span>批次分流：9.png➔P.10，10.png➔P.11，零密鑰碰撞</span>';
      
      const batchBtn = document.createElement('label');
      batchBtn.className = 'btn btn-next';
      batchBtn.style.cssText = 'padding: 4px 10px; font-size: 0.75rem; cursor: pointer;';
      batchBtn.textContent = '批次分流上傳';
      const batchInput = document.createElement('input');
      batchInput.type = 'file';
      batchInput.multiple = true;
      batchInput.accept = 'image/*';
      batchInput.style.display = 'none';
      batchInput.onchange = (e) => {
        const files = Array.from(e.target.files);
        files.forEach(f => {
          const lower = f.name.toLowerCase().trim();
          let pageNum = directScanToPageMap[lower] || directScanToPageMap[f.name];
          if (!pageNum) {
            const m = lower.match(/(\d+)/);
            if (m) {
              const num = parseInt(m[1], 10);
              const p = pages.find(x => x.pageNumber === num);
              if (p) pageNum = num;
            }
          }
          if (pageNum) {
            pageImages[pageNum] = URL.createObjectURL(f);
          }
        });
        alert(`已載入 ${files.length} 張圖片！`);
        buildManager();
        renderPage(currentIndex);
      };
      batchBtn.appendChild(batchInput);
      batchDiv.appendChild(batchBtn);
      managerList.appendChild(batchDiv);

      pages.forEach((p, idx) => {
        const row = document.createElement('div');
        row.className = 'page-row' + ((p.pageNumber === 10 || p.pageNumber === 11) ? ' highlight' : '');

        const info = document.createElement('div');
        const hasCustom = !!pageImages[p.pageNumber];
        info.innerHTML = `<span style="font-weight: 800; font-size: 0.85rem; margin-right: 8px;">P.${p.pageNumber}</span>
          <span style="font-size: 0.8rem; font-weight: 600;">${p.title}</span>
          <span style="font-size: 0.7rem; color: #64748b; margin-left: 8px;">(${p.fileName})</span>
          ${hasCustom ? '<span style="color: #059669; font-weight: bold; font-size: 0.7rem; margin-left: 6px;">● 已自訂</span>' : ''}`;

        const btns = document.createElement('div');
        btns.style.display = 'flex';
        btns.style.gap = '6px';

        const label = document.createElement('label');
        label.className = 'btn';
        label.style.cssText = 'padding: 3px 8px; font-size: 0.75rem; cursor: pointer;';
        label.textContent = '更換此頁';
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'image/*';
        fileInput.style.display = 'none';
        fileInput.onchange = (e) => {
          const f = e.target.files[0];
          if (f) {
            pageImages[p.pageNumber] = URL.createObjectURL(f);
            buildManager();
            renderPage(currentIndex);
          }
        };
        label.appendChild(fileInput);

        const gotoBtn = document.createElement('button');
        gotoBtn.className = 'btn';
        gotoBtn.style.cssText = 'padding: 3px 8px; font-size: 0.75rem;';
        gotoBtn.textContent = '前往';
        gotoBtn.onclick = () => {
          renderPage(idx);
          managerModal.classList.remove('open');
        };

        btns.appendChild(label);
        btns.appendChild(gotoBtn);
        row.appendChild(info);
        row.appendChild(btns);
        managerList.appendChild(row);
      });
    }

    // 事件監聽
    btnPrev.onclick = () => { if (currentIndex > 0) renderPage(currentIndex - 1); };
    btnNext.onclick = () => { if (currentIndex < pages.length - 1) renderPage(currentIndex + 1); };
    btnReplay.onclick = () => { if (activeHotspot) playHotspot(activeHotspot); };
    btnReadAll.onclick = () => {
      if (isReadingPage) stopSpeaking();
      else playWholePage();
    };

    // 語速切換 (0.7x 與 1.0x)
    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentRate = parseFloat(btn.dataset.rate);
      };
    });

    // 圖片管理 Modal 開關
    btnOpenManager.onclick = () => {
      buildManager();
      managerModal.classList.add('open');
    };
    btnCloseManager.onclick = () => {
      managerModal.classList.remove('open');
    };
    btnExport.onclick = () => {
      const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Journeys_Unit1_What_Is_A_Pal.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    // 鍵盤左右鍵翻頁
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') btnPrev.click();
      else if (e.key === 'ArrowRight') btnNext.click();
      else if (e.key === ' ') {
        e.preventDefault();
        btnReplay.click();
      }
    });

    renderPage(0);
  </script>
